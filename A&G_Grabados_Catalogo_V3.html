*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif}
/* Hero como imagen responsive */
.hero{background:transparent;text-align:center;padding:0;overflow:hidden}
.hero img{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain}

.hero h1,.hero p{display:none !important}
.hb{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto;padding:12px}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;border-radius:8px;font:inherit;font-size:.92rem;font-weight:600;cursor:pointer;text-align:center}
.btn.f{background:var(--inv);color:var(--invink);border-color:var(--inv)}

.btn:focus-visible,.chip:focus-visible,input:focus-visible{outline:3px solid #7f9cff;outline-offset:2px}

.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding:12px 18px;max-width:1040px;margin:0 auto}

.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;font:inherit;font-size:.9rem;cursor:pointer}

main{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;padding:6px 18px 90px;max-width:1040px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card.hl{outline:3px solid #7f9cff}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;aspect-ratio:1/1;background:var(--bg)}
.car>*{flex:none;width:100%;height:100%;scroll-snap-align:center}
.car img{object-fit:cover}.cw{display:block;position:relative}
.bd{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:99px}
.ph{display:grid;place-items:center;color:var(--mute);font-size:.85rem}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.cod{font-size:.78rem;color:var(--mute)}
.body h2{margin:0;font-size:1rem;line-height:1.25}
.pr{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;border-top:1px solid var(--line);padding-top:6px}
.pr b{font-variant-numeric:tabular-nums}
.act{display:flex;gap:8px;margin-top:auto;padding-top:8px}.act .btn{flex:1;padding:9px 8px;font-size:.88rem}
.vacio{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 0}
#wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--inv);color:var(--invink);display:grid;place-items:center}
#wa svg{width:30px;height:30px;fill:currentColor}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv);color:var(--invink);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .18s}
#toast.on{opacity:1}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
const num = s => { const n = parseInt(String(s||"").replace(/[^\d]/g,""),10); return isNaN(n)?0:n; };
const money = n => "$" + n.toLocaleString("es-AR");
const frase = s => { let t = String(s).toLowerCase().replace(/(\d)ml\b/g,"$1 ml").replace(/(\d)l\b/g,"$1 L"); return t.charAt(0).toUpperCase()+t.slice(1); };
const driveImg = (v, w) => { const m = String(v).match(/\/d\/([\w-]{15,})|[?&]id=([\w-]{15,})|^([\w-]{25,})$/); const id = m && (m[1]||m[2]||m[3]); return id ? `https://drive.google.com/thumbnail?id=${id}&sz=${w}` : v; };

const fotos = cod => (FOTOS[cod]||"").split(",").filter(Boolean).map(id => "https://drive.google.com/thumbnail?id="+id+"&sz=w700");
let P = SNAP.split("\n").map(l => { const a = l.split("|"); return {cod:a[0],cat:a[1],nom:a[2],marca:a[3],sin:num(a[4]),con:num(a[5]),imgs:fotos(a[0])}; });
let cat = "Todos", texto = "";

function csv(t){ const r=[]; let f="",row=[],q=false; for(let i=0;i<t.length;i++){ const c=t[i];
  if(q){ if(c==='"'&&t[i+1]==='"'){f+='"';i++;} else if(c==='"') q=false; else f+=c; }
  else if(c==='"') q=true; else if(c===","){row.push(f);f="";} else if(c==="\n"){row.push(f);r.push(row);row=[];f="";} else if(c!=="\r") f+=c; }
  row.push(f); r.push(row); return r; }

async function cargarPlanilla(){
  if(!CSV_URL) return;
  try {
    const rows = csv(await (await fetch(CSV_URL)).text()); const h = rows[0].map(norm);
    const ix = n => h.findIndex(x => x.startsWith(n));
    const c = {ok:ix("mostrar"),cod:ix("codigo"),cat:ix("categoria"),marca:ix("marca"),nom:ix("producto"),sin:ix("valor reventa"),con:ix("valor de grabado"),img:ix("imagen")};
    const out = rows.slice(1).filter(r => norm(r[c.ok])==="ok" && r[c.cod] && r[c.cat] && r[c.cat][0]!="#").map(r => ({
      cod:r[c.cod].trim(), cat:r[c.cat].trim(), nom:r[c.nom]||"", marca:r[c.marca]||"", sin:num(r[c.sin]), con:num(r[c.con]),
      imgs:(r[c.img]||"").split(/[,\n ]+/).map(u=>driveImg(u,700)).filter(Boolean)}));
    if(out.length){ out.forEach(p=>{ if(!p.imgs.length) p.imgs = fotos(p.cod); }); P = out; }
  } catch(e){ toast("No se pudo leer la planilla; se muestran los datos guardados"); }
}

function categorias(){
  const u = [...new Set(P.map(p => p.cat.toUpperCase()))];
  const rank = c => { const i = ORDEN.indexOf(c); return i<0 ? 99 : i; };
  return ["Todos", ...u.sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b))];
}
const nombreCat = c => c==="Todos" ? c : frase(c);
function chips(){ document.getElementById("chips").innerHTML = categorias().map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${esc(c)}">${esc(nombreCat(c))}</button>`).join(""); }

function render(){
  const q = norm(texto), rank = c => { const i=ORDEN.indexOf(c.toUpperCase()); return i<0?99:i; };
  const items = P.filter(p => (cat==="Todos"||p.cat.toUpperCase()===cat) && (!q || norm(p.nom+" "+p.cod+" "+p.marca).includes(q)))
    .sort((a,b)=>rank(a.cat)-rank(b.cat)||a.cod.localeCompare(b.cod));
  document.getElementById("lista").innerHTML = items.length ? items.map(p => `
    <article class="card" data-cod="${esc(p.cod)}">
      <div class="cw"><div class="car">${p.imgs.length ? p.imgs.map(u=>`<img src="${esc(u)}" alt="${esc(frase(p.nom))}" loading="lazy">`).join("") : `<div class="ph">Foto próximamente</div>`}</div></div>
      <div class="body">
        <span class="cod">${esc(p.cod)} · ${esc(nombreCat(p.cat.toUpperCase()))}</span>
        <h2>${esc(frase(p.nom))}</h2>
        <div class="pr"><span>Sin grabado</span><b>${money(p.sin)}</b></div>
        <div class="pr"><span>Con grabado</span><b>${p.con ? money(p.con) : "No se puede grabar"}</b></div>
        <div class="act">
          <a class="btn f" target="_blank" rel="noopener noreferrer" href="https://wa.me/${TEL}?text=${encodeURIComponent("Hola! Quiero consultar por "+frase(p.nom)+" (código "+p.cod+")")}">Consultar</a>
          <button class="btn" data-share="${esc(p.cod)}">Compartir</button>
        </div>
      </div>
    </article>`).join("") : `<p class="vacio">No encontramos artículos con ese filtro.</p>`;
}

function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),2200); }
async function compartir(cod){
  const p = P.find(x=>x.cod===cod); if(!p) return;
  const url = location.origin + location.pathname + "#" + encodeURIComponent(cod), msg = frase(p.nom) + " — A&G Grabados";
  if (navigator.share) { try { await navigator.share({title:msg,text:msg,url}); return; } catch(e){ if(e&&e.name==='AbortError') return; } }
  try { await navigator.clipboard.writeText(url); toast("Link copiado"); }
  catch(e){ window.open("https://wa.me/?text="+encodeURIComponent(msg+"\n"+url),"_blank","noopener"); }
}
function irAlArticulo(){
  let id=""; try { id = decodeURIComponent(location.hash.slice(1)); } catch(e){}
  document.querySelectorAll(".card.hl").forEach(c=>c.classList.remove("hl"));
  if(!id) return;
  const p = P.find(x=>x.cod.toLowerCase()===id.toLowerCase());
  if(!p){ toast("Ese artículo ya no está en el catálogo"); return; }
  if(cat!=="Todos"||texto){ cat="Todos"; texto=""; document.getElementById("q").value=""; chips(); render(); }
  const el = document.querySelector(`[data-cod="${CSS.escape(p.cod)}"]`);
  if(el){ el.classList.add("hl"); el.scrollIntoView({behavior:"smooth",block:"center"}); }
}

document.getElementById("chips").addEventListener("click", e=>{ const b=e.target.closest("[data-cat]"); if(!b) return; cat=b.dataset.cat; chips(); render(); });
document.getElementById("q").addEventListener("input", e=>{ texto=e.target.value; render(); });
document.getElementById("lista").addEventListener("click", e=>{ const b=e.target.closest("[data-share]"); if(b) compartir(b.dataset.share); });
document.getElementById("lista").addEventListener("scroll", e=>{ const c=e.target; if(c.classList&&c.classList.contains("car")){ const b=c.parentNode.querySelector(".bd"); if(b) b.textContent=(Math.round(c.scrollLeft/c.clientWidth)+1)+"/"+c.querySelectorAll("img").length; } });
window.addEventListener("hashchange", irAlArticulo);
chips(); render(); irAlArticulo();
cargarPlanilla().then(()=>{ chips(); render(); irAlArticulo(); });
